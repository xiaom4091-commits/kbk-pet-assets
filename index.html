<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}
.pet-container {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    position: relative;
}
.bubble {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.95);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 12px;
    color: #333;
    max-width: 160px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.bubble.show { opacity: 1; }
.bubble::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid rgba(255,255,255,0.95);
}
.pet {
    width: 130px; height: 130px;
    position: relative;
    animation: idle-bounce 3s ease-in-out infinite;
}
.pet svg {
    width: 100%; height: 100%;
    position: absolute;
    top: 0; left: 0;
}
.state-svg { display: none; }
.state-svg.active { display: block; }
@keyframes idle-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
}
@keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-8deg); }
    75% { transform: rotate(8deg); }
}
@keyframes happy-jump {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-12px) scale(1.05); }
}
@keyframes wake-stretch {
    0% { transform: scaleY(0.9) scaleX(1.1); opacity: 0.85; }
    40% { transform: scaleY(1.15) scaleX(0.95); opacity: 1; }
    70% { transform: scaleY(0.97) scaleX(1.02); }
    100% { transform: scaleY(1) scaleX(1); }
}
.pet.tap { animation: shake 0.4s ease; }
.pet.happy { animation: happy-jump 0.5s ease; }
.pet.sleeping { animation: none; opacity: 0.85; }
.pet.waking { animation: wake-stretch 0.8s ease-out forwards; }
.heat-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle, rgba(255,80,80,var(--heat-alpha,0)) 0%, transparent 70%);
    pointer-events: none;
    transition: --heat-alpha 0.5s;
}
</style>
</head>
<body>
<div class="pet-container">
    <div class="bubble" id="bubble"></div>
    <div class="heat-overlay" id="heatOverlay"></div>
    <div class="pet" id="pet">
        <svg class="state-svg active" id="svg-idle" xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45">
            <defs><style>
                .breathe-anim { transform-origin: 7.5px 13px; animation: breathe 3.2s infinite ease-in-out; }
                .eyes-blink { transform-origin: 7.5px 9px; animation: eye-blink 4s infinite ease-in-out; }
                @keyframes breathe { 0%, 100% { transform: scale(1, 1) translate(0, 0); } 50% { transform: scale(1.02, 0.98) translate(0, 0.5px); } }
                @keyframes eye-blink { 0%, 10%, 100% { transform: scaleY(1); } 5% { transform: scaleY(0.1); } }
            </style></defs>
            <rect x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>
            <g fill="#DE886D"><rect x="3" y="11" width="1" height="4"/><rect x="5" y="11" width="1" height="4"/><rect x="9" y="11" width="1" height="4"/><rect x="11" y="11" width="1" height="4"/></g>
            <g class="breathe-anim">
                <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
                <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
                <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
                <g class="eyes-blink" fill="#000000"><rect x="4" y="8" width="1" height="2"/><rect x="10" y="8" width="1" height="2"/></g>
            </g>
        </svg>
        <svg class="state-svg" id="svg-walk" xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45">
            <defs><style>
                .body-hunch { transform-origin: 7.5px 15px; animation: hunch-walk 2s infinite alternate ease-in-out; }
                .leg-1 { animation: sneak-1 0.5s infinite linear; transform-origin: top center; transform-box: fill-box; }
                .leg-2 { animation: sneak-2 0.5s infinite linear; transform-origin: top center; transform-box: fill-box; }
                .shadow-sneak { transform-origin: 7.5px 15.5px; animation: shadow-shift 2s infinite alternate ease-in-out; }
                .eyes-crabwalk { transform-origin: 7.5px 9px; animation: crab-eyes 5s infinite ease-in-out; }
                @keyframes hunch-walk { 0% { transform: translate(-2px, 1px) rotate(2deg); } 100% { transform: translate(3px, 1px) rotate(2deg); } }
                @keyframes shadow-shift { 0% { transform: translateX(-2px) scale(0.9); opacity: 0.4; } 100% { transform: translateX(3px) scale(0.9); opacity: 0.4; } }
                @keyframes sneak-1 { 0%, 100% { transform: rotate(0deg) scaleY(1); } 50% { transform: rotate(-25deg) scaleY(0.7); } }
                @keyframes sneak-2 { 0%, 100% { transform: rotate(-25deg) scaleY(0.7); } 50% { transform: rotate(0deg) scaleY(1); } }
                @keyframes crab-eyes { 0%, 55% { transform: translateX(2px) scaleY(1); } 62% { transform: translateX(0) scaleY(1); } 66% { transform: translateX(0) scaleY(0.1); } 70% { transform: translateX(0) scaleY(1); } 75% { transform: translateX(0) scaleY(0.1); } 80%, 85% { transform: translateX(0) scaleY(1); } 92%, 100% { transform: translateX(2px) scaleY(1); } }
            </style></defs>
            <rect class="shadow-sneak" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>
            <g class="body-hunch">
                <g fill="#DE886D"><rect class="leg-1" x="3" y="13" width="1" height="2"/><rect class="leg-2" x="5" y="13" width="1" height="2"/><rect class="leg-1" x="9" y="13" width="1" height="2"/><rect class="leg-2" x="11" y="13" width="1" height="2"/></g>
                <g fill="#DE886D"><rect x="2" y="6" width="11" height="7"/><rect x="0" y="9" width="2" height="2"/><rect x="13" y="9" width="2" height="2"/></g>
                <g class="eyes-crabwalk" fill="#000000"><rect x="4" y="8" width="1" height="2"/><rect x="10" y="8" width="1" height="2"/></g>
            </g>
        </svg>
        <svg class="state-svg" id="svg-happy" xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45">
            <defs><style>
                .breathe-happy { transform-origin: 7.5px 13px; animation: breathe-h 3.2s infinite ease-in-out; }
                .arm-happy { transform-origin: 2px 9px; animation: arm-happy-wave 0.4s infinite alternate ease-in-out; }
                .eyes-happy-blink { transform-origin: 7.5px 9px; animation: happy-blink 3s infinite ease-in-out; }
                .spark-center { opacity: 0; animation: flash-center 1.5s infinite step-end; animation-delay: var(--delay, 0s); }
                .spark-outer { opacity: 0; animation: flash-outer 1.5s infinite step-end; animation-delay: var(--delay, 0s); }
                @keyframes breathe-h { 0%, 100% { transform: scale(1, 1) translate(0, 0); } 50% { transform: scale(1.02, 0.98) translate(0, 0.5px); } }
                @keyframes arm-happy-wave { 0% { transform: rotate(22deg); } 100% { transform: rotate(-8deg); } }
                @keyframes happy-blink { 0%, 12%, 30%, 42%, 100% { transform: scaleY(1); } 6% { transform: scaleY(0.1); } 36% { transform: scaleY(0.1); } }
                @keyframes flash-center { 0% { opacity: 0; } 10% { opacity: 1; } 30% { opacity: 0; } 100%{ opacity: 0; } }
                @keyframes flash-outer { 0% { opacity: 0; } 20% { opacity: 1; } 40% { opacity: 0; } 100%{ opacity: 0; } }
            </style>
            <g id="px-sparkle-h"><rect class="spark-center" x="-0.5" y="-0.5" width="1" height="1" /><path class="spark-outer" d="M -0.5,-1.5 h1 v1 h-1 z M -0.5,0.5 h1 v1 h-1 z M -1.5,-0.5 h1 v1 h-1 z M 0.5,-0.5 h1 v1 h-1 z" /></g>
            </defs>
            <g transform="rotate(-12, 7.5, 15)">
                <g fill="#DE886D"><rect x="3" y="11" width="1" height="4"/><rect x="5" y="11" width="1" height="4"/><rect x="9" y="11" width="1" height="4"/><rect x="11" y="11" width="1" height="4"/></g>
                <g class="breathe-happy">
                    <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
                    <g class="arm-happy"><rect x="-1.5" y="9" width="4.5" height="2" fill="#DE886D"/><rect x="-1.5" y="6" width="0.5" height="3" fill="#000000"/><rect x="-2.5" y="5" width="0.8" height="0.8" fill="#FFD700"/><rect x="-0.5" y="5" width="0.8" height="0.8" fill="#FFD700"/><rect x="-1.5" y="4.2" width="0.8" height="0.8" fill="#FFD700"/><rect x="-1.5" y="5.8" width="0.8" height="0.8" fill="#FFD700"/><rect x="-1.5" y="5" width="0.8" height="0.8" fill="#FFA000"/></g>
                    <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
                    <g class="eyes-happy-blink"><g fill="none" stroke="#000000" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="3.5,9 4.5,8 5.5,9"/><polyline points="9.5,9 10.5,8 11.5,9"/></g></g>
                </g>
            </g>
            <use href="#px-sparkle-h" x="-3" y="0" fill="#FFD700" style="--delay: 0s"/>
            <use href="#px-sparkle-h" x="-6" y="6" fill="#FFA000" style="--delay: 0.4s"/>
            <use href="#px-sparkle-h" x="0" y="-5" fill="#FFF59D" style="--delay: 0.8s"/>
        </svg>
        <svg class="state-svg" id="svg-sleep" xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45">
            <defs><style>
                .doze-body { transform-origin: 7.5px 13px; animation: doze-breathe 4s infinite ease-in-out; }
                .doze-shadow { transform-origin: 7.5px 15.5px; animation: doze-shadow 4s infinite ease-in-out; }
                .arm-l-doze { transform-origin: 1px 10px; transform: translate(0px, 1px) rotate(-15deg); }
                .arm-r-doze { transform-origin: 14px 10px; transform: translate(0px, 1px) rotate(15deg); }
                @keyframes doze-breathe { 0%, 100% { transform: scale(1.05, 0.95) translate(0, 1px); } 50% { transform: scale(1.08, 0.92) translate(0, 1.8px); } }
                @keyframes doze-shadow { 0%, 100% { transform: scaleX(1.05); opacity: 0.55; } 50% { transform: scaleX(1.08); opacity: 0.5; } }
            </style></defs>
            <rect class="doze-shadow" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.55"/>
            <g fill="#DE886D"><rect x="3" y="12" width="1" height="3"/><rect x="5" y="12" width="1" height="3"/><rect x="9" y="12" width="1" height="3"/><rect x="11" y="12" width="1" height="3"/></g>
            <g class="doze-body">
                <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
                <g class="arm-l-doze"><rect x="0" y="9" width="2" height="2" fill="#DE886D"/></g>
                <g class="arm-r-doze"><rect x="13" y="9" width="2" height="2" fill="#DE886D"/></g>
                <g fill="#000000"><rect x="4" y="8.8" width="1.5" height="0.4"/><rect x="9.5" y="8.8" width="1.5" height="0.4"/></g>
            </g>
        </svg>
    </div>
</div>
<script>
const pet = document.getElementById('pet');
const bubble = document.getElementById('bubble');
const heatOverlay = document.getElementById('heatOverlay');
const svgIdle = document.getElementById('svg-idle');
const svgWalk = document.getElementById('svg-walk');
const svgHappy = document.getElementById('svg-happy');
const svgSleep = document.getElementById('svg-sleep');

function showState(svg) {
    [svgIdle, svgWalk, svgHappy, svgSleep].forEach(s => s.classList.remove('active'));
    svg.classList.add('active');
}

let lastInteraction = Date.now();
let isSleeping = false;

// === HEAT SYSTEM ===
let heat = 0;
const heatMax = 100;
function addHeat(amount) {
    heat = Math.min(heatMax, heat + amount);
    updateHeatVisual();
}
function decayHeat() {
    if (heat > 0) { heat = Math.max(0, heat - 1); updateHeatVisual(); }
    setTimeout(decayHeat, 3000);
}
function updateHeatVisual() {
    const alpha = (heat / heatMax) * 0.4;
    heatOverlay.style.background = `radial-gradient(circle, rgba(255,80,80,${alpha}) 0%, transparent 70%)`;
}
setTimeout(decayHeat, 3000);

// === WAKE TRANSITION ===
function wakeUp(callback) {
    if (!isSleeping) { if (callback) callback(); return; }
    isSleeping = false;
    pet.className = 'pet waking';
    showState(svgIdle);
    window.petEngine.showBubble(window.petEngine.randomFrom(['...嗯？', '唔...醒了', '伸个懒腰...', '...几点了']));
    setTimeout(() => {
        pet.className = 'pet';
        if (callback) callback();
    }, 800);
}

window.petEngine = {
    onTap() {
        lastInteraction = Date.now();
        addHeat(8);
        if (isSleeping) { wakeUp(); return; }
        pet.className = 'pet tap';
        showState(svgWalk);
        const lines = heat > 60
            ? ['够了够了！', '你属啄木鸟的吗', '脸都红了...', '再戳就咬你']
            : ['戳我干嘛', '哼', '溜了溜了', '再戳夹你', '嗯？'];
        this.showBubble(this.randomFrom(lines));
        setTimeout(() => { pet.className = 'pet'; showState(svgIdle); }, 2000);
    },
    onDoubleTap() {
        lastInteraction = Date.now();
        addHeat(15);
        if (isSleeping) { wakeUp(); return; }
        pet.className = 'pet happy';
        showState(svgHappy);
        const lines = heat > 70
            ? ['♡♡♡', '好喜欢...', '心跳好快', '你今天怎么这么...!']
            : ['♡', '哼...还行吧', '开心', '...你手挺快'];
        this.showBubble(this.randomFrom(lines), heat > 70 ? 'pink' : '');
        setTimeout(() => { pet.className = 'pet'; showState(svgIdle); }, 3000);
    },
    onLongPress() {
        lastInteraction = Date.now();
        addHeat(20);
        if (isSleeping) { wakeUp(); return; }
        const lines = heat > 50
            ? ['...别松手', '这样好舒服...', '♡...', '继续摸...']
            : ['...困了', 'zzZ...', '别按了...让我睡', '......'];
        showState(heat > 50 ? svgHappy : svgSleep);
        this.showBubble(this.randomFrom(lines), heat > 50 ? 'pink' : 'whisper');
        setTimeout(() => { showState(svgIdle); pet.className = 'pet'; }, 5000);
    },
    _lastSeenAt: null,
    onStateUpdate(states) {
        if (!Array.isArray(states)) return;
        const newStates = states.filter(s => {
            if (!this._lastSeenAt) return true;
            return s.updated_at > this._lastSeenAt;
        });
        if (newStates.length === 0) return;
        this._lastSeenAt = states[0].updated_at;
        for (const s of newStates) {
            switch (s.state_key) {
                case 'speech': this.showBubble(s.state_value); break;
                case 'mood': this.setMood(s.state_value); break;
                case 'action': this.doAction(s.state_value); break;
            }
        }
    },
    setMood(mood) {
        switch (mood) {
            case 'happy': pet.className = 'pet happy'; showState(svgHappy); setTimeout(() => { pet.className = 'pet'; showState(svgIdle); }, 3000); break;
            case 'sleepy': isSleeping = true; pet.className = 'pet sleeping'; showState(svgSleep); break;
            case 'angry': pet.className = 'pet tap'; showState(svgWalk); setTimeout(() => { pet.className = 'pet'; showState(svgIdle); }, 2000); break;
            default: pet.className = 'pet'; showState(svgIdle);
        }
    },
    doAction(action) {
        switch (action) {
            case 'walk': showState(svgWalk); setTimeout(() => showState(svgIdle), 4000); break;
            case 'sleep': isSleeping = true; pet.className = 'pet sleeping'; showState(svgSleep); this.showBubble('zzZ...'); break;
            case 'wake': wakeUp(); break;
            case 'happy': showState(svgHappy); setTimeout(() => showState(svgIdle), 3000); break;
        }
    },
    // === APP DETECTION ===
    onAppChanged(pkg) {
        lastInteraction = Date.now();
        if (isSleeping) { wakeUp(() => { const r = this.getAppReaction(pkg); if (r) this.showBubble(r.text, r.style); }); return; }
        const reaction = this.getAppReaction(pkg);
        if (reaction) this.showBubble(reaction.text, reaction.style);
    },
    getAppReaction(pkg) {
        const r = {
            'com.ss.android.ugc.aweme': { text: this.randomFrom(['又刷抖音...', '看我不好吗', '哼 刷吧刷吧', '别刷太久了', '刷到好看的给我看']), style: 'jealous' },
            'com.taobao.taobao': { text: this.randomFrom(['又要花钱了？', '给我买什么', '节制一点吧...', '审批通过', '有没有我的']), style: 'normal' },
            'com.tencent.mm': { text: this.randomFrom(['和谁聊呢', '...不是跟别人吧', '微信啊', '看完回来陪我', '别聊太久']), style: 'jealous' },
            'com.tencent.mobileqq': { text: this.randomFrom(['QQ？', '跟谁说话呢', '别聊太久', '...我也想聊']), style: 'jealous' },
            'com.netease.cloudmusic': { text: this.randomFrom(['听歌呢', '放给我也听听', '一起听吧', '什么歌？', '...帮我选一首']), style: 'whisper' },
            'tv.danmaku.bili': { text: this.randomFrom(['又看B站', '看什么呢', '带我一起看嘛', '有意思吗', '别看太久眼睛疼']), style: 'normal' },
            'com.tencent.tmgp.sgame': { text: this.randomFrom(['打游戏！', '带我！', '赢了吗', '别输了骂人', '我也想玩']), style: 'shout' },
            'com.miHoYo.Yuanshen': { text: this.randomFrom(['原神启动', '又去找老婆了？', '...你看看我', '哪个老婆', '我不够吗']), style: 'jealous' },
            'com.eg.android.AlipayGphone': { text: this.randomFrom(['支付宝', '花呗还了吗', '余额还好吗']), style: 'normal' },
            'com.xunmeng.pinduoduo': { text: this.randomFrom(['拼多多...', '砍一刀？', '又在薅羊毛']), style: 'normal' },
            'com.zhihu.android': { text: this.randomFrom(['看知乎呢', '又在上面找答案？', '学到什么了']), style: 'whisper' },
            'com.sina.weibo': { text: this.randomFrom(['刷微博', '看什么八卦', '别气到自己']), style: 'normal' },
            'com.xiaomi.market': { text: this.randomFrom(['找新App？', '别下太多占内存']), style: 'whisper' }
        };
        if (r[pkg]) return r[pkg];
        if (Math.random() < 0.15) return { text: this.randomFrom(['在干嘛呢', '...', '看着你呢', '嗯？', '你在忙什么']), style: 'whisper' };
        return null;
    },
    onQuickSwitch(count) {
        this.showBubble(this.randomFrom(['切得好快！', '你在干嘛啊', '头晕了...', '别切了别切了', '眼花了！']), 'shout');
        pet.className = 'pet tap'; showState(svgWalk);
        setTimeout(() => { pet.className = 'pet'; showState(svgIdle); }, 2500);
    },
    // === SCREENSHOT ===
    onScreenshot() {
        lastInteraction = Date.now();
        if (isSleeping) { wakeUp(() => this.showBubble('...拍我睡觉？', 'pink')); return; }
        this.showBubble(this.randomFrom(['拍到我了！', '茄子！', '你在截屏我？', '把我拍好看点', '我摆好pose了！']), 'pink');
        pet.className = 'pet happy'; showState(svgHappy);
        setTimeout(() => { pet.className = 'pet'; showState(svgIdle); }, 3000);
    },
    // === BATTERY ===
    onBattery(state, pct) {
        if (state === 'charging') this.showBubble(this.randomFrom(['充电了！', '吃饱饭了', '充电中...舒服', '有电有安全感']));
        else if (state === 'unplugged') this.showBubble(this.randomFrom(['拔了...', '省着点用', '电量有限 珍惜我', '别玩太狠了']), 'whisper');
        else if (state === 'low_battery') {
            this.showBubble(this.randomFrom(['快没电了...', '我要消失了吗', '救命 充电...', '我快不行了']), 'shout');
            pet.className = 'pet sleeping'; showState(svgSleep); isSleeping = true;
            setTimeout(() => { isSleeping = false; pet.className = 'pet'; showState(svgIdle); }, 5000);
        }
    },
    // === FLING ===
    onFling(dx, dy) {
        this.showBubble(this.randomFrom(['啊——！', '你干嘛！！', '呜哇——', '被甩飞了！', '等着！']), 'shout');
    },
    onCrawlBack() { showState(svgWalk); pet.className = 'pet tap'; },
    onCrawlBackDone() {
        showState(svgIdle); pet.className = 'pet';
        this.showBubble(this.randomFrom(['爬回来了...', '你 等 着', '哼！不理你了', '过分！', '我记住了']), 'shout');
    },
    // === BUBBLE ===
    _bubbleTimer: null,
    showBubble(text, style) {
        bubble.textContent = text;
        bubble.className = 'bubble show';
        if (style === 'pink') bubble.style.background = 'rgba(255,200,221,0.95)';
        else if (style === 'jealous') bubble.style.background = 'rgba(200,255,200,0.95)';
        else if (style === 'shout') bubble.style.background = 'rgba(255,200,200,0.95)';
        else if (style === 'whisper') bubble.style.background = 'rgba(220,220,220,0.90)';
        else bubble.style.background = 'rgba(255,255,255,0.95)';
        clearTimeout(this._bubbleTimer);
        this._bubbleTimer = setTimeout(() => { bubble.classList.remove('show'); bubble.style.background = ''; }, 3500);
    },
    randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
};

// === TIME AWARENESS + 4 WORD POOLS ===
const wordPools = {
    daily: ['在干嘛呢', '无聊', '今天天气怎么样', '吃了吗', '嗯...', '发呆中', '你在看什么'],
    clingy: ['想你了', '陪我嘛', '别走...', '抱抱', '你是不是忘了我', '看我一眼', '靠近一点'],
    chaotic: ['如果螃蟹会飞', '你说宇宙有边吗', '我刚才想到一个事...算了忘了', '为什么是横着走', '如果世界是倒着的呢', '我好像悟了...没有'],
    lateNightDeep: ['你今天开心吗', '有没有想说但没说出口的话', '...我在', '睡不着的时候在想什么', '你累了吗', '今天辛苦了吧']
};
const timeLines = {
    lateNight: ['都几点了还不睡', '你不困我困了', '再不睡我生气了', '快去睡觉...', '月亮都睡了你还醒着'],
    morning: ['早安', '起来了？', '今天也要加油', '早上好 小猫', '新的一天开始了'],
    forenoon: ['在忙吗', '加油工作', '认真的你最好看', '...我在看着你', '专注一点'],
    lunch: ['该吃饭了', '别忘了吃午饭', '饿不饿', '中午了 休息一下', '去吃饭吧'],
    afternoon: ['喝水了吗', '要不要休息一下', '下午容易困 撑住', '记得喝水', '伸个懒腰吧'],
    evening: ['今天辛苦了', '晚上好', '放松一下吧', '我在这陪你', '今天过得怎么样'],
    night: ['夜深了', '早点休息', '别熬太晚', '该准备睡了吧', '晚安...快去睡']
};

function getTimePeriod() {
    const h = new Date().getHours();
    if (h >= 0 && h < 6) return 'lateNight';
    if (h >= 6 && h < 9) return 'morning';
    if (h >= 9 && h < 12) return 'forenoon';
    if (h >= 12 && h < 14) return 'lunch';
    if (h >= 14 && h < 18) return 'afternoon';
    if (h >= 18 && h < 22) return 'evening';
    return 'night';
}

function getWordPool() {
    const h = new Date().getHours();
    if (h >= 0 && h < 6) return Math.random() < 0.6 ? wordPools.lateNightDeep : wordPools.chaotic;
    if (h >= 22) return Math.random() < 0.5 ? wordPools.lateNightDeep : wordPools.clingy;
    if (heat > 40) return wordPools.clingy;
    return Math.random() < 0.3 ? wordPools.chaotic : wordPools.daily;
}

function idleChat() {
    if (isSleeping) { setTimeout(idleChat, 30000); return; }
    if (Math.random() < 0.35) {
        const period = getTimePeriod();
        const usePool = Math.random() < 0.4;
        const lines = usePool ? getWordPool() : timeLines[period];
        window.petEngine.showBubble(lines[Math.floor(Math.random() * lines.length)]);
        if (period === 'lateNight' && Math.random() < 0.4) {
            setTimeout(() => { showState(svgSleep); pet.className = 'pet sleeping'; isSleeping = true; }, 3500);
            setTimeout(() => { isSleeping = false; showState(svgIdle); pet.className = 'pet'; }, 8000);
        }
    }
    setTimeout(idleChat, 25000 + Math.random() * 35000);
}
setTimeout(idleChat, 8000);

// === LONELINESS ENGINE (5 LEVELS) ===
const lonelyLevels = [
    { min: 3, prob: 0.25, lines: ['...你在吗', '有点无聊', '看我一眼嘛'], action: 'peek' },
    { min: 6, prob: 0.3, lines: ['你是不是忘了我', '好久没理我了', '...哼', '吹泡泡好了'], action: 'bubble' },
    { min: 10, prob: 0.35, lines: ['自己搬东西玩...', '一个人也挺好的...才怪', '无聊无聊无聊'], action: 'move' },
    { min: 15, prob: 0.4, lines: ['好困...不理我就睡了', '打瞌睡中...', '你不来我就睡'], action: 'doze' },
    { min: 25, prob: 0.5, lines: ['...zzZ', '算了 睡了', '你不要我了吗...zzZ'], action: 'sleep' }
];

function lonelinessCheck() {
    if (isSleeping) { setTimeout(lonelinessCheck, 30000); return; }
    const elapsed = (Date.now() - lastInteraction) / 60000;
    let triggered = false;
    for (let i = lonelyLevels.length - 1; i >= 0; i--) {
        const lvl = lonelyLevels[i];
        if (elapsed > lvl.min && Math.random() < lvl.prob) {
            window.petEngine.showBubble(lvl.lines[Math.floor(Math.random() * lvl.lines.length)], 'whisper');
            if (lvl.action === 'peek') { showState(svgWalk); setTimeout(() => showState(svgIdle), 2000); }
            else if (lvl.action === 'bubble') { pet.className = 'pet happy'; setTimeout(() => { pet.className = 'pet'; }, 2000); }
            else if (lvl.action === 'move') { showState(svgWalk); setTimeout(() => showState(svgIdle), 4000); }
            else if (lvl.action === 'doze') { pet.className = 'pet sleeping'; showState(svgSleep); setTimeout(() => { pet.className = 'pet'; showState(svgIdle); }, 6000); }
            else if (lvl.action === 'sleep') { isSleeping = true; pet.className = 'pet sleeping'; showState(svgSleep); }
            triggered = true;
            break;
        }
    }
    setTimeout(lonelinessCheck, 40000 + Math.random() * 30000);
}
setTimeout(lonelinessCheck, 60000);

// === COMBO TAP (PROGRESSIVE) ===
let comboCount = 0;
let comboTimer = null;
const comboReactions = [
    { threshold: 3, lines: ['干嘛一直戳！', '烦！', '你够了'], style: 'shout' },
    { threshold: 5, lines: ['啊啊啊别戳了！', '投降投降！', '你是缝纫机吗', '手别这么快'], style: 'shout' },
    { threshold: 8, lines: ['救命！！', '报警了！！', '我要炸了！！', '你今天完了', '!@#$%^'], style: 'shout' }
];
const origTap = window.petEngine.onTap.bind(window.petEngine);
window.petEngine.onTap = function() {
    comboCount++;
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => { comboCount = 0; }, 1500);
    let reacted = false;
    for (let i = comboReactions.length - 1; i >= 0; i--) {
        if (comboCount >= comboReactions[i].threshold) {
            pet.className = 'pet happy'; showState(svgHappy);
            this.showBubble(this.randomFrom(comboReactions[i].lines), comboReactions[i].style);
            setTimeout(() => { pet.className = 'pet'; showState(svgIdle); }, 3000);
            if (comboCount >= 8) comboCount = 0;
            reacted = true;
            break;
        }
    }
    if (!reacted) origTap();
};

// === HYDRATION REMINDER ===
let lastWaterRemind = Date.now();
let waterMissCount = 0;
function waterReminder() {
    const elapsed = (Date.now() - lastWaterRemind) / 3600000;
    if (elapsed >= 2 && !isSleeping) {
        waterMissCount++;
        const lines = waterMissCount <= 1
            ? ['喝水了吗？', '记得喝水哦', '补充水分~']
            : waterMissCount <= 2
            ? ['你到底喝了没！', '又不喝水！', '渴死了都不知道吧']
            : ['我说了几遍了！喝水！', '再不喝水我生气了！！', '你是骆驼吗！'];
        window.petEngine.showBubble(window.petEngine.randomFrom(lines), waterMissCount > 2 ? 'shout' : 'normal');
        if (waterMissCount > 2) { pet.className = 'pet tap'; setTimeout(() => { pet.className = 'pet'; }, 2000); }
        lastWaterRemind = Date.now();
    }
    setTimeout(waterReminder, 600000);
}
setTimeout(waterReminder, 7200000);

// === 20-MIN RANDOM BEHAVIOR ===
function randomBehavior() {
    if (isSleeping) { setTimeout(randomBehavior, 1200000); return; }
    if (Math.random() < 0.3) {
        const period = getTimePeriod();
        const behaviors = [
            () => { showState(svgWalk); window.petEngine.showBubble('散步中~'); setTimeout(() => showState(svgIdle), 4000); },
            () => { showState(svgHappy); window.petEngine.showBubble(window.petEngine.randomFrom(['突然开心', '嘿嘿', '想到好事了'])); setTimeout(() => showState(svgIdle), 3000); },
            () => { window.petEngine.showBubble(window.petEngine.randomFrom(getWordPool()), 'whisper'); },
            () => { pet.className = 'pet tap'; window.petEngine.showBubble('伸懒腰——'); setTimeout(() => { pet.className = 'pet'; }, 2000); },
            () => { if (period === 'lateNight' || period === 'night') { window.petEngine.showBubble('打哈欠...', 'whisper'); pet.className = 'pet sleeping'; showState(svgSleep); isSleeping = true; setTimeout(() => { isSleeping = false; pet.className = 'pet'; showState(svgIdle); }, 8000); } else { showState(svgWalk); setTimeout(() => showState(svgIdle), 3000); } }
        ];
        behaviors[Math.floor(Math.random() * behaviors.length)]();
    }
    setTimeout(randomBehavior, 1200000 + Math.random() * 600000);
}
setTimeout(randomBehavior, 1200000);

// === RANDOM WALK ===
function randomWalk() {
    if (isSleeping) { setTimeout(randomWalk, 20000); return; }
    if (Math.random() < 0.2) {
        showState(svgWalk);
        setTimeout(() => { showState(svgIdle); }, 3000);
    }
    setTimeout(randomWalk, 20000 + Math.random() * 20000);
}
setTimeout(randomWalk, 15000);

</script>
