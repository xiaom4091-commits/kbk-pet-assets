<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}
.pet-container {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    position: relative;
}
.bubble {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.95);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 12px;
    color: #333;
    max-width: 160px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.bubble.show { opacity: 1; }
.bubble::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid rgba(255,255,255,0.95);
}
.pet {
    width: 130px; height: 130px;
    position: relative;
    animation: idle-bounce 3s ease-in-out infinite;
}
.pet svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
.state-svg { display: none; }
.state-svg.active { display: block; }
@keyframes idle-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes shake { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
@keyframes happy-jump { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-12px) scale(1.05); } }
@keyframes wake-stretch { 0% { transform: scaleY(0.9) scaleX(1.1); opacity: 0.85; } 40% { transform: scaleY(1.15) scaleX(0.95); opacity: 1; } 70% { transform: scaleY(0.97) scaleX(1.02); } 100% { transform: scaleY(1) scaleX(1); } }
.pet.tap { animation: shake 0.4s ease; }
.pet.happy { animation: happy-jump 0.5s ease; }
.pet.sleeping { animation: none; opacity: 0.85; }
.pet.waking { animation: wake-stretch 0.8s ease-out forwards; }
.heat-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle, rgba(255,80,80,0) 0%, transparent 70%);
    pointer-events: none;
}

.hat-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
}
.hat-layer svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
.hat-svg { display: none; }
.hat-svg.hat-active { display: block; }
</style>
</head>

<!--
  clawd-experiment-headphones-groove-v6.svg
  v5 基础上鹿鹿两个微调:
  1. 眼睛 V 字 y +0.5 (顶 8->8.5 底 9->9.5) — v5 位置偏高
  2. 耳罩压缩 0.78 -> 0.85 (缩量 22%->15%), 过冲 1.04 -> 1.02 一起收 — v5 压太多
-->
<svg class="state-svg" id="svg-headphones_groove" xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" >
  <defs>
    <style>
      .shadow-sway {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: shadow-sway 1.6s infinite ease-in-out;
      }

      .body-sway {
        transform-origin: 7.5px 13px;
        animation: body-sway 1.6s infinite ease-in-out;
      }

      .leg-left-inner,
      .leg-left-outer,
      .leg-right-inner,
      .leg-right-outer {
        transform-box: fill-box;
        transform-origin: 50% 0%;
      }
      .leg-left-inner  { animation: leg-left-inner  1.6s infinite ease-in-out; }
      .leg-left-outer  { animation: leg-left-outer  1.6s infinite ease-in-out; }
      .leg-right-inner { animation: leg-right-inner 1.6s infinite ease-in-out; }
      .leg-right-outer { animation: leg-right-outer 1.6s infinite ease-in-out; }

      .arm-left-dance  {
        transform-box: fill-box;
        transform-origin: 100% 0%;
        animation: arm-left-dance 1.6s infinite ease-in-out;
      }
      .arm-right-dance {
        transform-box: fill-box;
        transform-origin: 0% 0%;
        animation: arm-right-dance 1.6s infinite ease-in-out;
      }

      /* 耳罩 squeeze: 拍点挤压, 中性回弹过冲 */
      .earcup-left {
        transform-box: fill-box;
        transform-origin: 100% 50%; /* 右边缘 = 内侧, 朝身体方向收 */
        animation: earcup-squeeze 1.6s infinite ease-in-out;
      }
      .earcup-right {
        transform-box: fill-box;
        transform-origin: 0% 50%;   /* 左边缘 = 内侧 */
        animation: earcup-squeeze 1.6s infinite ease-in-out;
      }

  <style>

<svg class="state-svg" id="svg-mini_alert" xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" >
  <defs>
    <style>
      .breathe-anim {
        transform-origin: 7.5px 13px;
        animation: breathe 3.2s infinite ease-in-out;
      }

      .arm-alert {
        transform-origin: 2px 9px;
        animation: alert-arm 4s infinite ease-in-out;
      }

      /* Normal rect eyes: visible first, hidden after blink */
      .eyes-rect {
        transform-origin: 7.5px 9px; /* eye vertical center for blink */
        animation: rect-vis 4s infinite step-end, rect-move 4s infinite ease-in-out;
      }

      /* xmark squint eyes: hidden first, visible after switch */
      .eyes-xmark {
        visibility: hidden;
        animation: xmark-vis 4s infinite step-end;
      }

      .alert-pop {
        animation: alert-flash 4s infinite ease-in-out;
        opacity: 0;
      }

      @keyframes breathe {
        0%, 100% { transform: scale(1, 1) translate(0, 0); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.5px); }
      }

      @keyframes alert-arm {
        0%, 49% { transform: rotate(0deg); }
        51% { transform: rotate(20deg); }
        60% { transform: rotate(-8deg); }
        64% { transform: rotate(20deg); }
        68% { transform: rotate(-8deg); }
        72% { transform: rotate(20deg); }
        76% { transform: rotate(-8deg); }
        80% { transform: rotate(20deg); }
        84% { transform: rotate(-8deg); }
        88% { transform: rotate(20deg); }
        92%, 100% { transform: rotate(0deg); }
      }

      /* Rect eyes: center, wait for exclamation, slowly look left, back, pause, blink, switch */
      @keyframes rect-move {
        0%, 16% { transform: translate(0, 0) scaleY(1); }
        22%, 28% { transform: translate(-2px, 0) scaleY(1); }
        34% { transform: translate(0, 0) scaleY(1); }
        36% { transform: translate(0, 0) scaleY(0.1); }
        37%, 39% { transform: translate(0, 0) scaleY(1); }
        41% { transform: translate(0, 0) scaleY(0.1); }
        42%, 100% { transform: translate(0, 0) scaleY(1); }
      }

      /* Rect eyes visibility: visible → hidden at 22%, back at 91% */
      @keyframes rect-vis {
        0% { visibility: visible; }
        42% { visibility: hidden; }
        91% { visibility: visible; }
      }

      /* xmark eyes visibility: hidden at start, visible at 42%, hidden at 89% */
      @keyframes xmark-vis {
        0% { visibility: hidden; }
        42% { visibility: visible; }
        89% { visibility: hidden; }
      }

      @keyframes alert-flash {
        0%, 8% { opacity: 0; transform: scale(0.5); }
        12% { opacity: 1; transform: translate(0, -4px) scale(1.2); }
        20%, 70% { opacity: 1; transform: translate(0, -4px) scale(1); }
        85%, 100% { opacity: 0; transform: translate(0, -6px) scale(0.8); }
      }
    </style>
  </defs>

  <!-- Entire character leaning -->
  <g transform="rotate(-12, 7.5, 15)">

    <!-- Legs -->
    <g fill="#DE886D">
      <rect x="3" y="11" width="1" height="4"/>
      <rect x="5" y="11" width="1" height="4"/>
      <rect x="9" y="11" width="1" height="4"/>
      <rect x="11" y="11" width="1" height="4"/>
    </g>

    <g id="body-js">
      <g class="breathe-anim">
        <!-- Torso -->
        <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

        <!-- Left Arm — still then shake -->
        <g class="arm-alert">
          <rect x="-1.5" y="9" width="4.5" height="2" fill="#DE886D"/>
        </g>

        <!-- Right Arm -->
        <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>

        <!-- Phase 1: Normal rect eyes (look left at exclamation, then blink away) -->
        <g class="eyes-rect" fill="#000000">

<svg class="state-svg" id="svg-notification" xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" >
  <!-- PoC v8: v7 左右翻转版
       唯一改动: master-group 加 transform="translate(15, 0) scale(-1, 1)"
                围绕 viewBox 中心 X=7.5 镜像翻转
       视觉效果: 举手从右上变左上, body 倾斜方向反转, 左右腿角色互换
       本仓库版额外压缩前段 timing: 更快举手, 保留中后段亮灯 hold
       ground-shadow 在 master-group 外保持不动 (本身左右对称)
  -->

  <!-- v7 原注释保留作为技术参考: v6 + 眼睛序列 + 灯泡跟手摆动 + rays 居中修正
       v6 → v7 三件改动:
         1. 眼睛运动序列:
            - 11-16% rect 眼移到右上看灯泡 (+1px, -0.5px)
            - 16-24% 保持看灯泡
            - 28% 回正中
            - 30% 眨眼 (scaleY 0.1)
            - 31-72% 切换为 ^^ 微笑眼 (复刻 mini-happy 的 polyline)
            - 73-74% 微笑收起, rect 重新睁开
            实现: rect 眼 + smile 眼 两套元素叠加, opacity step-end 切换 + scaleY 眨眼
         2. 灯泡跟手微摆: lightbulb-zone 在 hold 期 (30-66%) 加微抖 (跟身体晃同步)
            translate ±0.3px / ±0.2px, 比身体晃小一档, 表达"被举着也跟着重心晃"
         3. rays 重排居中:
            - 上下 y 范围从 [-5.8~7.2] 改为 [-5~5] 严格对称
            - 几何中心从 (13.5, 1.0) 上移到 (13.5, 0.5), 更接近灯泡玻璃罩中心 (13.04, 0.16)
            - transform-origin 同步改为 13.5px 0.5px

       6s loop 时间轴:
         0-3%    idle
         3-10%   右手举到 -3px
         10-16%  右手 hold + 灯泡 pop, 11% 眼睛开始看灯泡
         16-24%  ★ 用力: body 右倾下压, 左腿被挤抬, 右手多举 1.5px
         24-30%  眼睛回正中 + 灯丝亮起
         24-66%  hold 用力姿态 + rays 闪 + body/腿/灯泡微抖
         30%     眨眼瞬间
         31-72%  ^^ 微笑眼显示
         66-76%  右手回到 -3px, body 回正
         70%     灯泡消失
         73-74%  微笑收起, rect 眼重新睁开
         76-84%  右手放下
         84-100% 复位 idle
  -->

  <defs>
    <style>
      .body-breathe {
        transform-box: view-box;
        transform-origin: 7.5px 12px;
        animation: body-breathe 6s infinite ease-in-out;
      }
      @keyframes body-breathe {
        0%, 12%, 84%, 100% { transform: translateY(0); }
        38%, 64%           { transform: translateY(-0.28px); }
        72%                { transform: translateY(-0.12px); }
      }

      #ground-shadow {
        transform-box: view-box;
        transform-origin: 7.5px 15.5px;
        animation: shadow-breathe 6s infinite ease-in-out;
      }
      @keyframes shadow-breathe {
        0%, 12%, 84%, 100% { opacity: 0.5; transform: scaleX(1); }
        38%, 64%           { opacity: 0.36; transform: scaleX(0.86); }
        72%                { opacity: 0.44; transform: scaleX(0.94); }
      }

      /* === body 右倾下压 + hold 期 4 次微晃 (重心不稳) === */
      .body-tilt {
        transform-box: view-box;
        transform-origin: 7.5px 13px;
        animation: body-tilt 6s infinite ease-in-out;
      }
      @keyframes body-tilt {
        0%, 16%, 76%, 100% { transform: rotate(0deg) scaleY(1); }
        24%                { transform: rotate(3deg) scaleY(0.97); }
        39%                { transform: rotate(4.5deg) scaleY(0.97); }
        48%                { transform: rotate(2deg) scaleY(0.97); }
        57%                { transform: rotate(4deg) scaleY(0.97); }
        66%                { transform: rotate(3deg) scaleY(0.97); }
      }

      /* === 左两腿被挤抬起 + hold 期 6 次微抖 (用力颤抖) === */
      .leg-left-inner {
        transform-box: fill-box;
        transform-origin: 50% 0%;
        animation: leg-left-inner 6s infinite ease-in-out;
      }
      @keyframes leg-left-inner {
        0%, 16%, 76%, 100% { transform: rotate(0deg); }
        24%                { transform: rotate(12deg); }
        36%                { transform: rotate(15deg); }
        42%                { transform: rotate(9deg); }
        48%                { transform: rotate(15deg); }
        54%                { transform: rotate(9deg); }
        60%                { transform: rotate(15deg); }
        66%                { transform: rotate(12deg); }
      }
      .leg-left-outer {
        transform-box: fill-box;
        transform-origin: 50% 0%;
        animation: leg-left-outer 6s infinite ease-in-out;
      }
      @keyframes leg-left-outer {
        0%, 16%, 76%, 100% { transform: rotate(0deg); }
        24%                { transform: rotate(22deg); }
        36%                { transform: rotate(26deg); }
        42%                { transform: rotate(19deg); }
        48%                { transform: rotate(26deg); }
        54%                { transform: rotate(19deg); }
        60%                { transform: rotate(26deg); }
        66%                { transform: rotate(22deg); }
      }

      /* === 左手: hold 期下沉 + 微晃 (配重稳平衡) === */
      .arm-l-balance {
        transform-box: fill-box;
        transform-origin: 100% 0%;
        animation: arm-l-balance 6s infinite ease-in-out;
      }
      @keyframes arm-l-balance {
        0%, 16%, 76%, 100% { transform: translate(0, 0) rotate(0deg); }
        24%                { transform: translate(0, 0.5px) rotate(-2deg); }
        37%                { transform: translate(0, 0.55px) rotate(1deg); }
        44%                { transform: translate(0, 0.5px) rotate(-3deg); }
        51%                { transform: translate(0, 0.55px) rotate(2deg); }
        58%                { transform: translate(0, 0.5px) rotate(-1deg); }
        66%                { transform: translate(0, 0.5px) rotate(0deg); }
      }

      /* === 右手: idle → 举到 -3 → 用力多举到 -4.5 → 回落 → 放下 === */
      .arm-r {
        transform-origin: 13px 10px;
        animation: arm-r 6s infinite ease-in-out;
      }
      @keyframes arm-r {
        0%, 3%    { transform: none; }
        10%, 16%  { transform: translateY(-3px) rotate(-90deg); }
        24%, 66%  { transform: translateY(-4.5px) rotate(-90deg); }
        76%       { transform: translateY(-3px) rotate(-90deg); }
        80%, 100% { transform: none; }
      }

      /* === 灯泡 + rays 整组跟着右手举更高 + hold 期跟身体微摆 === */
      .lightbulb-zone {
        transform-box: view-box;
        transform-origin: 0 0;
        animation: lightbulb-zone 6s infinite ease-in-out;
      }
      @keyframes lightbulb-zone {
        0%, 16%, 76%, 100% { transform: translate(0, 0); }

        39%                { transform: translate(0.3px, -1.7px); }
        48%                { transform: translate(-0.2px, -1.3px); }
        57%                { transform: translate(0.3px, -1.6px); }
        66%                { transform: translate(0, -1.5px); }
      }

      /* === 眼睛: rect 眼 (idle/看灯泡/眨眼) === */
      .eyes-rect {
        transform-box: view-box;
        transform-origin: 7.5px 9px;
        animation:
          eyes-rect-move 6s infinite ease-in-out,
          eyes-rect-vis 6s infinite step-end;
      }
      @keyframes eyes-rect-move {
        0%, 11%       { transform: translate(0, 0) scaleY(1); }
        16%, 24%      { transform: translate(1px, -0.5px) scaleY(1); }   /* 看灯泡 */
        28%           { transform: translate(0, 0) scaleY(1); }          /* 回正中 */
        30%           { transform: translate(0, 0) scaleY(0.1); }        /* 眨眼 */
        72%           { transform: translate(0, 0) scaleY(0.1); }        /* 闭眼期 */
        74%, 100%     { transform: translate(0, 0) scaleY(1); }          /* 睁开 */
      }
      @keyframes eyes-rect-vis {
        0%, 30%       { opacity: 1; }
        31%, 72%      { opacity: 0; }
        73%, 100%     { opacity: 1; }
      }

      /* === 眼睛: ^^ 微笑眼 (灯泡 hold 期出现, 复刻 mini-happy) === */
      .eyes-smile {
        opacity: 0;
        animation: eyes-smile-vis 6s infinite step-end;
      }
      @keyframes eyes-smile-vis {
        0%, 30%       { opacity: 0; }
        31%, 72%      { opacity: 1; }
        73%, 100%     { opacity: 0; }
      }

      /* === 灯泡: 头顶固定点 pop 出现 → 8 次亮灯 → 消失 === */
      .bulb {
        transform-box: view-box;
        transform-origin: 0 0;
        opacity: 0;
        animation: bulb-fly 6s infinite ease-in-out;
      }
      @keyframes bulb-fly {
        0%, 11%   { opacity: 0; transform: translate(9.5px, -2.7px) scale(0.15); }
        13%       { opacity: 1; transform: translate(9.5px, -2.7px) scale(0.27); }

        70%, 100% { opacity: 0; transform: translate(9.5px, -2.7px) scale(0.2); }
      }

      /* === 暗/亮玻璃: 只做一次灰色到亮起, 之后保持亮 === */
      .bulb rect[fill="#FFB000"] { animation: glass-edge 6s infinite step-end; }
      .bulb rect[fill="#FFD400"] { animation: glass-main 6s infinite step-end; }
      .bulb rect[fill="#E88900"] { animation: glass-shadow 6s infinite step-end; }
      .bulb rect[fill="#FFFFFF"],
      .bulb rect[fill="#FFF8B8"] { animation: glass-highlight 6s infinite step-end; }

      @keyframes glass-main {
        0%, 19%   { fill: #8A7428; }
        20%, 70%  { fill: #FFD400; }
        71%, 100% { fill: #8A7428; }
      }
      @keyframes glass-edge {
        0%, 19%   { fill: #725B20; }
        20%, 70%  { fill: #FFB000; }
        71%, 100% { fill: #725B20; }
      }
      @keyframes glass-shadow {
        0%, 19%   { fill: #56451D; }
        20%, 70%  { fill: #E88900; }
        71%, 100% { fill: #56451D; }
      }
      @keyframes glass-highlight {
        0%, 19%   { opacity: 0.25; }
        20%, 70%  { opacity: 1; }
        71%, 100% { opacity: 0.25; }
      }

      .f-anim { animation: filament-f 6s infinite step-end; }

        0%, 19%   { fill: #555; }
        20%, 70%  { fill: #C96E00; }
        71%, 100% { fill: #555; }

        20%, 70%  { fill: #E89500; }
        71%, 100% { fill: #777; }
      }

      .rays {
        transform-box: view-box;
        transform-origin: 13.5px 0.5px;
        opacity: 0;
        animation: rays-burst 6s infinite ease-in-out;
      }
      @keyframes rays-burst {

        61%, 100% { opacity: 0; transform: translate(-0.1px, -0.1px) scale(0.65); }
      }
    </style>

<svg class="state-svg" id="svg-react_annoyed" xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" >
  <defs>
    <style>
      /* ===== 6s one-shot: annoyed, pause, resigned sigh, slow return =====
         Phase 1 (0-6%,    ~0.36s): Flinch
         Phase 2 (6-18%,   ~0.72s): Lean away + hand block + question mark
         Phase 3 (18-35%,  ~1.02s): Hold — stay annoyed, question mark fades
         Phase 4 (35-55%,  ~1.20s): Sigh — hand drops, body slumps, puff cloud
         Phase 5 (55-70%,  ~0.90s): Linger slumped — still tired
         Phase 6 (70-90%,  ~1.20s): Slow return
         Phase 7 (90-100%, ~0.60s): Still
      */

      .body-react {
        transform-origin: 7.5px 12px;
        animation: body-react 6s 1 ease-in-out forwards;
      }
      .arm-l-react {
        transform-origin: 2px 10px;
        animation: arm-l-react 6s 1 ease-in-out forwards;
      }
      .eyes-react {
        transform-origin: 7.5px 9px;
        animation: eyes-react 6s 1 ease-in-out forwards;
      }
      .shadow-react {
        transform-origin: 7.5px 15.5px;
        animation: shadow-react 6s 1 ease-in-out forwards;
      }
      .qmark {
        opacity: 0;
        transform-origin: 8px -2px;
        animation: qmark-pop 6s 1 ease-out forwards;
      }
      .sigh-cloud {
        opacity: 0;
        transform-origin: 16px 9px;
        animation: sigh-puff 6s 1 ease-out forwards;
      }

      /* Body: flinch, lean, HOLD, sigh slump, LINGER, slow return */
      @keyframes body-react {
        0%        { transform: translate(0, 0) scale(1, 1); }
        4%        { transform: translate(0, 1.5px) scale(1, 1); }
        6%        { transform: translate(0, 1px) scale(1, 1); }
        14%       { transform: translate(2px, 0) scale(1, 1); }
        /* hold annoyed pose */
        35%       { transform: translate(2px, 0) scale(1, 1); }
        /* sigh: rise then slump */
        40%       { transform: translate(1.5px, -0.5px) scale(1, 1.01); }
        46%       { transform: translate(1px, 1px) scale(1.03, 0.97); }
        52%       { transform: translate(0.5px, 0.5px) scale(1.01, 0.99); }
        /* linger slumped */
        68%       { transform: translate(0.3px, 0.3px) scale(1, 1); }
        /* slow return */
        85%       { transform: translate(0, 0) scale(1, 1); }
        100%      { transform: translate(0, 0) scale(1, 1); }
      }

      /* Left arm: block, hold, resigned drop */
      @keyframes arm-l-react {
        0%        { transform: rotate(0deg); }
        6%        { transform: rotate(0deg); }
        14%       { transform: rotate(-50deg); }
        /* hold block through pause */
        35%       { transform: rotate(-45deg); }
        /* resigned drop */
        43%       { transform: rotate(-15deg); }
        48%       { transform: rotate(0deg); }
        100%      { transform: rotate(0deg); }
      }

      /* Eyes: squint, half-lid, HOLD, sigh-close, tired linger, recover */
      @keyframes eyes-react {
        0%        { transform: scaleY(1); }
        3%        { transform: scaleY(0.2); }
        6%        { transform: scaleY(0.6); }
        14%       { transform: scaleY(0.5); }
        /* hold half-lid through pause */
        35%       { transform: scaleY(0.5); }
        /* sigh: close then reopen tired */
        40%       { transform: scaleY(0.1); }
        46%       { transform: scaleY(0.6); }
        /* linger tired */
        68%       { transform: scaleY(0.6); }
        /* blink, back to normal */
        74%       { transform: scaleY(0.1); }
        78%       { transform: scaleY(1); }
        100%      { transform: scaleY(1); }
      }

      /* Question mark: pop during lean, fade during hold */
      @keyframes qmark-pop {
        0%, 4%    { opacity: 0; transform: translate(0, 4px) scale(0.5); }
        10%       { opacity: 1; transform: translate(0, 0) scale(1.1); }
        14%, 26%  { opacity: 1; transform: translate(0, 0) scale(1); }
        34%       { opacity: 0; transform: translate(0, -3px) scale(1.1); }
        100%      { opacity: 0; }
      }

      /* Sigh puff: breath cloud after hold */
      @keyframes sigh-puff {
        0%, 37%   { opacity: 0; transform: translate(0, 1px) scale(0.3); }
        43%       { opacity: 0.6; transform: translate(0, 0) scale(0.8); }
        48%       { opacity: 0.7; transform: translate(1px, 0) scale(1); }
        60%       { opacity: 0; transform: translate(4px, -4px) scale(1.3); }
        100%      { opacity: 0; }
      }

      /* Shadow */
      @keyframes shadow-react {
        0%        { transform: translate(0, 0) scaleX(1); opacity: 0.5; }
        4%        { transform: translate(0, 0) scaleX(0.93); opacity: 0.45; }
        14%       { transform: translate(1px, 0) scaleX(1); opacity: 0.5; }
        35%       { transform: translate(1px, 0) scaleX(1); opacity: 0.5; }
        46%       { transform: translate(0.5px, 0) scaleX(1.05); opacity: 0.55; }
        68%       { transform: translate(0.3px, 0) scaleX(1.02); opacity: 0.52; }
        85%       { transform: translate(0, 0) scaleX(1); opacity: 0.5; }
        100%      { transform: translate(0, 0) scaleX(1); opacity: 0.5; }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect class="shadow-react" x="3" y="15" width="9" height="1" fill="#000" opacity="0.5"/>

  <!-- Static Legs -->
  <g fill="#DE886D">
    <rect x="3" y="11" width="1" height="4"/>
    <rect x="5" y="11" width="1" height="4"/>
    <rect x="9" y="11" width="1" height="4"/>
    <rect x="11" y="11" width="1" height="4"/>
  </g>

  <!-- Animated Upper Body -->
  <g class="body-react">
    <!-- Torso -->
    <g fill="#DE886D">
      <rect x="2" y="6" width="11" height="7"/>
    </g>
    <!-- Arms -->
    <g fill="#DE886D">
      <g class="arm-l-react"><rect x="0" y="9" width="2" height="2"/></g>
      <rect x="13" y="9" width="2" height="2"/>
    </g>
    <!-- Eyes -->
    <g class="eyes-react" fill="#000">
      <rect x="4" y="8" width="1" height="2"/>
      <rect x="10" y="8" width="1" height="2"/>
    </g>
    <!-- Question mark -->
    <g class="qmark" fill="#5C9CE6">
      <rect x="7" y="-5" width="2" height="1"/>
      <rect x="6" y="-4" width="1" height="1"/>
      <rect x="9" y="-4" width="1" height="2"/>
      <rect x="8" y="-2" width="1" height="1"/>
      <rect x="7" y="-1" width="1" height="1"/>
      <rect x="7" y="1" width="1" height="1"/>
    </g>
    <!-- Sigh puff cloud (right side of face) -->
    <g class="sigh-cloud" fill="#FFF">
      <rect x="14" y="9" width="2" height="1"/>
      <rect x="15" y="8" width="2" height="1"/>
      <rect x="16" y="7" width="2" height="1"/>
    </g>
  </g>
</svg>
<svg class="state-svg" id="svg-react_double_jump" xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" >
  <defs>
    <style>
      /* ===== 3.5s one-shot: startled jump, pat chest, settle =====
         Phase 1 (0-15%):   Jump — body flies high, legs fly less, arms out, exclamation pops
         Phase 2 (15-40%):  Land — squash cushion, micro bounce, exclamation fades
         Phase 3 (40-70%):  Pat chest — right arm strokes chest, calming
         Phase 4 (70-100%): Settle — arm down, blink, still
      */

      /* Body vertical jump (flies high) */
      .body-jump {
        animation: body-jump 3.5s 1 ease-in-out forwards;
      }

      /* Legs vertical jump (flies less = gap with body) */
      .legs-jump {
        animation: legs-jump 3.5s 1 ease-in-out forwards;
      }

      /* Upper body squash/stretch */
      .body-react {
        transform-origin: 7.5px 13px;
        animation: body-squash 3.5s 1 ease-in-out forwards;
      }

      .arm-l-react {
        transform-origin: 2px 10px;
        animation: arm-l-react 3.5s 1 ease-in-out forwards;
      }
      .arm-r-react {
        transform-origin: 13px 10px;
        animation: arm-r-react 3.5s 1 ease-in-out forwards;
      }
      /* Eyes: gaze wrapper, rect eyes (blink+vis), xmark eyes (vis) */
      .eyes-gaze {
        animation: eyes-gaze 3.5s 1 ease-in-out forwards;
      }
      .eyes-rect {
        transform-origin: 7.5px 9px;
        animation: eyes-blink 3.5s 1 ease-in-out forwards, rect-vis 3.5s 1 step-end forwards;
      }
      .eyes-xmark {
        visibility: hidden;
        animation: xmark-vis 3.5s 1 step-end forwards;
      }
      .shadow-react {
        transform-origin: 7.5px 15.5px;
        animation: shadow-react 3.5s 1 ease-in-out forwards;
      }
      .excl-pop {
        animation: excl-pop 3.5s 1 ease-in-out forwards;
        opacity: 0;
      }

      /* ==================== Keyframes ==================== */

      /* Body jumps HIGH */
      @keyframes body-jump {
        0%        { transform: translateY(0); }
        10%       { transform: translateY(-5px); }
        15%       { transform: translateY(-4.5px); }
        /* fast drop */
        23%       { transform: translateY(1px); }
        29%       { transform: translateY(-0.5px); }
        35%       { transform: translateY(0); }
        100%      { transform: translateY(0); }
      }

      /* Legs jump LESS = visible gap from body */
      @keyframes legs-jump {
        0%        { transform: translateY(0); }
        10%       { transform: translateY(-2px); }
        15%       { transform: translateY(-1.5px); }
        23%       { transform: translateY(0.5px); }
        29%       { transform: translateY(-0.3px); }
        35%       { transform: translateY(0); }
        100%      { transform: translateY(0); }
      }

      /* Body squash on landing + sigh during chest pat */
      @keyframes body-squash {
        0%        { transform: scale(1, 1); }
        10%       { transform: scale(0.88, 0.88); }
        15%       { transform: scale(0.9, 0.9); }
        23%       { transform: scale(1.1, 0.9); }
        29%       { transform: scale(0.97, 1.03); }
        35%       { transform: scale(1, 1); }
        /* sigh: exhale compression while hand rests on chest */
        45%       { transform: scale(1.03, 0.97); }
        55%       { transform: scale(1, 1); }
        100%      { transform: scale(1, 1); }
      }

      /* Left arm: fly out, return, rest */
      @keyframes arm-l-react {
        0%        { transform: translate(0, 0) rotate(0deg); }
        10%       { transform: translate(-2px, -2px) rotate(70deg); }
        15%       { transform: translate(-1.5px, -1.5px) rotate(55deg); }
        30%       { transform: translate(0, 0) rotate(0deg); }
        100%      { transform: translate(0, 0) rotate(0deg); }
      }

      /* Right arm: fly out, return, rest on chest (relief), slow pat, lower */
      @keyframes arm-r-react {
        0%        { transform: translate(0, 0) rotate(0deg); }
        /* Phase 1: fly out */
        10%       { transform: translate(2px, -2px) rotate(-70deg); }
        15%       { transform: translate(1.5px, -1.5px) rotate(-55deg); }
        /* Phase 2: return */
        32%       { transform: translate(0, 0) rotate(0deg); }
        /* Phase 3: hand to chest — HOLD first (the relief moment) */
        40%       { transform: rotate(-50deg); }
        50%       { transform: rotate(-50deg); }
        /* slow pat: one gentle press */
        56%       { transform: rotate(-42deg); }
        62%       { transform: rotate(-48deg); }
        /* Phase 4: lower */
        78%       { transform: rotate(-15deg); }
        90%       { transform: rotate(0deg); }
        100%      { transform: rotate(0deg); }
      }

      /* Gaze direction (shared by both eye types) */
      @keyframes eyes-gaze {
        0%, 35%   { transform: translate(0, 0); }
        42%, 63%  { transform: translate(0, 0.5px); }
        70%, 100% { transform: translate(0, 0); }
      }

      /* Rect eyes: widen, blink on land, blink-shut to gate xmark switch, blink-open on return */
      @keyframes eyes-blink {
        0%        { transform: scaleY(1); }
        8%        { transform: scaleY(1.3); }
        15%       { transform: scaleY(1.2); }
        /* blink on impact */
        23%       { transform: scaleY(0.1); }
        30%       { transform: scaleY(1); }
        /* blink shut — gates switch to xmark at 38% */
        36%       { transform: scaleY(0.1); }
        /* hidden from 38%, value irrelevant */
        50%       { transform: scaleY(0.1); }
        /* reappear at 82% still shut — gates switch from xmark */
        82%       { transform: scaleY(0.1); }
        88%       { transform: scaleY(1); }
        100%      { transform: scaleY(1); }
      }

      /* Rect eyes visibility: hide during xmark phase */
      @keyframes rect-vis {
        0%  { visibility: visible; }
        38% { visibility: hidden; }
        82% { visibility: visible; }
      }

      /* xmark eyes visibility: show during chest pat phase */
      @keyframes xmark-vis {
        0%  { visibility: hidden; }
        38% { visibility: visible; }
        82% { visibility: hidden; }
      }

      /* Shadow: shrink on jump, expand on land */
      @keyframes shadow-react {
        0%        { transform: scaleX(1); opacity: 0.5; }
        10%       { transform: scaleX(0.55); opacity: 0.2; }
        15%       { transform: scaleX(0.6); opacity: 0.23; }
        23%       { transform: scaleX(1.12); opacity: 0.55; }
        29%       { transform: scaleX(0.95); opacity: 0.48; }
        35%       { transform: scaleX(1); opacity: 0.5; }
        100%      { transform: scaleX(1); opacity: 0.5; }
      }

      /* Exclamation: emerge from below (head level), pop up high, fade */
      @keyframes excl-pop {
        0%, 4%    { opacity: 0; transform: translate(0, 10px) scale(0.3); }
        10%       { opacity: 1; transform: translate(0, 0) scale(1.3); }
        15%, 30%  { opacity: 1; transform: translate(0, 0) scale(1); }
        42%       { opacity: 0; transform: translate(0, -2px) scale(0.8); }
        100%      { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Ground Shadow (stays on ground) -->
  <rect class="shadow-react" x="3" y="15" width="9" height="1" fill="#000" opacity="0.5"/>

  <!-- Legs (jump less than body = visible separation) -->
  <g class="legs-jump" fill="#DE886D">
    <rect x="3" y="13" width="1" height="2"/>
    <rect x="5" y="13" width="1" height="2"/>
    <rect x="9" y="13" width="1" height="2"/>
    <rect x="11" y="13" width="1" height="2"/>
  </g>

  <!-- Body (jumps higher) -->
  <g class="body-jump">
    <g class="body-react">
      <!-- Torso -->
      <g fill="#DE886D">
        <rect x="2" y="6" width="11" height="7"/>
      </g>
      <!-- Arms -->
      <g fill="#DE886D">
        <g class="arm-l-react"><rect x="0" y="9" width="2" height="2"/></g>
        <g class="arm-r-react"><rect x="13" y="9" width="2" height="2"/></g>
      </g>
      <!-- Eyes -->
      <g class="eyes-gaze">
        <!-- Normal rect eyes (phases 1,2,4) -->
        <g class="eyes-rect" fill="#000">
          <rect x="4" y="8" width="1" height="2"/>
          <rect x="10" y="8" width="1" height="2"/>
        </g>
        <!-- Small square eyes (phase 3: chest pat — relieved squint) -->
        <g class="eyes-xmark" fill="#000">
          <rect x="4" y="9" width="1" height="1"/>
          <rect x="10" y="9" width="1" height="1"/>
        </g>
      </g>
    </g>

    <!-- Exclamation mark (moves with body, base position high above head) -->
    <g class="excl-pop" fill="#FF3D00">
      <rect x="7" y="-5" width="1.5" height="3"/>
      <rect x="7" y="-1" width="1.5" height="1.5"/>
    </g>
  </g>
</svg>
<svg class="state-svg" id="svg-working_carrying" xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" >
  <defs>
    <style>
      .body-walk {
        transform-origin: 7.5px 15px;
        animation: walk-bounce 0.4s infinite ease-in-out;
      }
      .step-a { animation: step 0.4s infinite ease-in-out; }
      .step-b { animation: step 0.4s infinite ease-in-out; animation-delay: -0.2s; }
      .pack-swing {
        transform-origin: 13px 8px;
        animation: pack-swing 0.4s infinite alternate ease-in-out;
      }
      .arm-swing-l {
        transform-origin: 2px 9px;
        animation: arm-swing 0.4s infinite alternate ease-in-out;
      }
      .cap-sway {
        transform-origin: 6px 6.5px;
        animation: cap-sway 0.8s infinite alternate ease-in-out;
      }
      .shadow-walk {
        transform-origin: 7.5px 15.5px;
        animation: shadow-walk 0.4s infinite ease-in-out;
      }

      /* Eyes three-layer */
      .eyes-gaze { animation: eyes-gaze 2.5s infinite; }
      .eyes-rect {
        transform-origin: 7.5px 9px;
        animation: eyes-blink-rush 2.5s infinite, rect-vis 2.5s infinite step-end;
      }
      .eyes-xmark {
        visibility: hidden;
        animation: xmark-vis 2.5s infinite step-end;
      }

      /* Sweat: only during xmark period */
      .sweat-1 { animation: sweat1-fly 2.5s infinite; }
      .sweat-2 { animation: sweat2-fly 2.5s infinite; }

      @keyframes walk-bounce {
        0%, 50%, 100% { transform: translateY(1px); }
        25%, 75%       { transform: translateY(0); }
      }
      @keyframes step {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-1px); }
      }
      @keyframes pack-swing {
        0%   { transform: rotate(3deg); }
        100% { transform: rotate(-3deg); }
      }
      @keyframes arm-swing {
        0%   { transform: rotate(-8deg); }
        100% { transform: rotate(8deg); }
      }
      @keyframes cap-sway {
        0%   { transform: rotate(-3deg); }
        100% { transform: rotate(3deg); }
      }
      @keyframes shadow-walk {
        0%, 50%, 100% { transform: scale(1.03); opacity: 0.55; }
        25%, 75%       { transform: scale(1); opacity: 0.5; }
      }

      /* Gaze: left while rushing, center during xmark */
      @keyframes eyes-gaze {
        0%, 15%, 88%, 100% { transform: translate(-1px, 0); }
        25%, 80%           { transform: translate(0, 0); }
      }
      /* Rect blink + gate at 28% and 78% */
      @keyframes eyes-blink-rush {
        0%, 4%, 100%  { transform: scaleY(1); }
        6%            { transform: scaleY(0.1); }
        8%            { transform: scaleY(1); }
        28%           { transform: scaleY(0.1); }
        31%, 76%      { transform: scaleY(1); }
        78%           { transform: scaleY(0.1); }
        83%           { transform: scaleY(1); }
      }
      /* Rect hidden during xmark */
      @keyframes rect-vis {
        0%  { visibility: visible; }
        29% { visibility: hidden; }

      }
      /* Xmark shown during xmark */
      @keyframes xmark-vis {
        0%  { visibility: hidden; }
        29% { visibility: visible; }
        79% { visibility: hidden; }

      /* Sweat only during xmark (synced to 2.5s) */
      @keyframes sweat1-fly {
        0%, 27%  { transform: translate(0, 0); opacity: 0; }

        55%      { transform: translate(4px, -3px); opacity: 0; }

      }
      @keyframes sweat2-fly {
        0%, 37%  { transform: translate(0, 0); opacity: 0; }
        41%      { transform: translate(0, 0); opacity: 1; }
        65%      { transform: translate(2px, -5px); opacity: 0; }
        100%     { opacity: 0; }
      }
    </style>
  </defs>

  <rect class="shadow-walk" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <g transform="rotate(-2, 7.5, 15)">
  <g class="body-walk">
    <!-- Backpack -->
    <g class="pack-swing">
      <rect x="13" y="7" width="4" height="6" fill="#5C9CE6"/>
      <rect x="12" y="8" width="5" height="4" fill="#5C9CE6"/>
      <rect x="13" y="7" width="4" height="2" fill="#3D7AC7"/>

    <!-- Legs -->

      <rect class="step-b" x="9" y="13" width="1" height="2"/>
      <rect class="step-a" x="11" y="13" width="1" height="2"/>

    <!-- Body -->

    <!-- Right strap -->
    <rect x="13" y="7" width="1" height="4" fill="#3D7AC7"/>

    <!-- Eyes: gaze + rect/xmark toggle -->

      <g class="eyes-rect" fill="#000000">
        <rect x="4" y="8" width="1" height="2"/>
        <rect x="10" y="8" width="1" height="2"/>

      <g class="eyes-xmark" fill="none" stroke="#000000"
         stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round">

        <polyline points="11,8 9.5,9 11,10"/>

      <rect x="14.25" y="4.5" width="0.5" height="0.5"/>
    </g>

      <rect x="16.25" y="3.5" width="0.5" height="0.5"/>

</div>
<script>
const pet = document.getElementById('pet');
const bubble = document.getElementById('bubble');
const heatOverlay = document.getElementById('heatOverlay');
const svgIdle = document.getElementById('svg-idle');
const svgWalk = document.getElementById('svg-walk');
const svgHappy = document.getElementById('svg-happy');
const svgSleep = document.getElementById('svg-sleep');
// New states
const svgError = document.getElementById('svg-error');
const svgHeadphones = document.getElementById('svg-headphones_groove');
const svgBubbleIdle = document.getElementById('svg-idle_bubble');
const svgDoze = document.getElementById('svg-idle_doze');
const svgAlert = document.getElementById('svg-mini_alert');
const svgPeek = document.getElementById('svg-mini_peek');
const svgNotif = document.getElementById('svg-notification');
const svgAnnoyed = document.getElementById('svg-react_annoyed');
const svgDoubleJump = document.getElementById('svg-react_double_jump');
const svgCarrying = document.getElementById('svg-working_carrying');

const allSvgs = [svgIdle, svgWalk, svgHappy, svgSleep, svgError, svgHeadphones, svgBubbleIdle, svgDoze, svgAlert, svgPeek, svgNotif, svgAnnoyed, svgDoubleJump, svgCarrying];

function showState(svg) {
    allSvgs.forEach(s => { if(s) s.classList.remove('active'); });
    if(svg) svg.classList.add('active');
}

let lastInteraction = Date.now();
let isSleeping = false;

// === HEAT SYSTEM ===
let heat = 0;
const heatMax = 100;
function addHeat(amount) {
    heat = Math.min(heatMax, heat + amount);
    updateHeatVisual();
}
function decayHeat() {
    if (heat > 0) { heat = Math.max(0, heat - 1); updateHeatVisual(); }
    setTimeout(decayHeat, 3000);
}
function updateHeatVisual() {
    const alpha = (heat / heatMax) * 0.4;
    heatOverlay.style.background = `radial-gradient(circle, rgba(255,80,80,${alpha}) 0%, transparent 70%)`;
}
setTimeout(decayHeat, 3000);

// === WAKE TRANSITION ===
function wakeUp(callback) {
    if (!isSleeping) { if (callback) callback(); return; }
    isSleeping = false;
    pet.className = 'pet waking';
    showState(svgIdle);
    window.petEngine.showBubble(window.petEngine.randomFrom(['...嗯？', '唔...醒了', '伸个懒腰...', '...几点了']));
    setTimeout(() => {
        pet.className = 'pet';
        if (callback) callback();
    }, 800);
}

window.petEngine = {
    onTap() {
        lastInteraction = Date.now();
        addHeat(8);
        if (isSleeping) { wakeUp(); return; }
        pet.className = 'pet tap';
        showState(svgAnnoyed || svgWalk);
        const lines = heat > 60
            ? ['够了够了！', '你属啄木鸟的吗', '脸都红了...', '再戳就咬你']
            : ['戳我干嘛', '哼', '溜了溜了', '再戳夹你', '嗯？'];
        this.showBubble(this.randomFrom(lines));
        setTimeout(() => { pet.className = 'pet'; showState(svgIdle); }, 2000);
    },
    onDoubleTap() {
        lastInteraction = Date.now();
        addHeat(15);
        if (isSleeping) { wakeUp(); return; }
        pet.className = 'pet happy';
        showState(svgDoubleJump || svgHappy);
        const lines = heat > 70
            ? ['♡♡♡', '好喜欢...', '心跳好快', '你今天怎么这么...!']
            : ['♡', '哼...还行吧', '开心', '...你手挺快'];
        this.showBubble(this.randomFrom(lines), heat > 70 ? 'pink' : '');
        setTimeout(() => { pet.className = 'pet'; showState(svgIdle); }, 3000);
    },
    onLongPress() {
        lastInteraction = Date.now();
        addHeat(20);
        if (isSleeping) { wakeUp(); return; }
        const lines = heat > 50
            ? ['...别松手', '这样好舒服...', '♡...', '继续摸...']
            : ['...困了', 'zzZ...', '别按了...让我睡', '......'];
        showState(heat > 50 ? svgHappy : svgDoze);
        this.showBubble(this.randomFrom(lines), heat > 50 ? 'pink' : 'whisper');
        setTimeout(() => { showState(svgIdle); pet.className = 'pet'; }, 5000);
    },
    _lastSeenAt: null,
    onStateUpdate(states) {
        if (!Array.isArray(states)) return;
        const newStates = states.filter(s => {
            if (!this._lastSeenAt) return true;
            return s.updated_at > this._lastSeenAt;
        });
        if (newStates.length === 0) return;
        this._lastSeenAt = states[0].updated_at;
        for (const s of newStates) {
            switch (s.state_key) {
                case 'speech': this.showBubble(s.state_value); break;
                case 'mood': this.setMood(s.state_value); break;
                case 'action': this.doAction(s.state_value); break;
            }
        }
    },
    setMood(mood) {
        switch (mood) {
            case 'happy': pet.className = 'pet happy'; showState(svgHappy); setTimeout(() => { pet.className = 'pet'; showState(svgIdle); }, 3000); break;
            case 'sleepy': isSleeping = true; pet.className = 'pet sleeping'; showState(svgSleep); break;
            case 'angry': pet.className = 'pet tap'; showState(svgAnnoyed); setTimeout(() => { pet.className = 'pet'; showState(svgIdle); }, 2000); break;
            default: pet.className = 'pet'; showState(svgIdle);
        }
    },
    doAction(action) {
        switch (action) {
            case 'walk': showState(svgWalk); setTimeout(() => showState(svgIdle), 4000); break;
            case 'sleep': isSleeping = true; pet.className = 'pet sleeping'; showState(svgSleep); this.showBubble('zzZ...'); break;
            case 'wake': wakeUp(); break;
            case 'happy': showState(svgHappy); setTimeout(() => showState(svgIdle), 3000); break;
        }
    },
    // === APP DETECTION ===
    onAppChanged(pkg) {
        lastInteraction = Date.now();
        if (isSleeping) { wakeUp(() => { const r = this.getAppReaction(pkg); if (r) this.showBubble(r.text, r.style); }); return; }
        const reaction = this.getAppReaction(pkg);
        if (reaction) {
            if (reaction.svg) showState(reaction.svg);
            this.showBubble(reaction.text, reaction.style);
            if (reaction.svg) setTimeout(() => showState(svgIdle), 4000);
        }
    },
    getAppReaction(pkg) {
        const r = {
            'com.ss.android.ugc.aweme': { text: this.randomFrom(['又刷抖音...', '看我不好吗', '哼 刷吧刷吧', '别刷太久了', '刷到好看的给我看']), style: 'jealous', svg: svgAnnoyed },
            'com.taobao.taobao': { text: this.randomFrom(['又要花钱了？', '给我买什么', '节制一点吧...', '审批通过', '有没有我的']), style: 'normal' },
            'com.tencent.mm': { text: this.randomFrom(['和谁聊呢', '...不是跟别人吧', '微信啊', '看完回来陪我', '别聊太久']), style: 'jealous', svg: svgPeek },
            'com.tencent.mobileqq': { text: this.randomFrom(['QQ？', '跟谁说话呢', '别聊太久', '...我也想聊']), style: 'jealous', svg: svgPeek },
            'com.netease.cloudmusic': { text: this.randomFrom(['听歌呢', '放给我也听听', '一起听吧', '什么歌？', '...帮我选一首']), style: 'whisper', svg: svgHeadphones },
            'tv.danmaku.bili': { text: this.randomFrom(['又看B站', '看什么呢', '带我一起看嘛', '有意思吗', '别看太久眼睛疼']), style: 'normal' },
            'com.tencent.tmgp.sgame': { text: this.randomFrom(['打游戏！', '带我！', '赢了吗', '别输了骂人', '我也想玩']), style: 'shout', svg: svgAlert },
            'com.miHoYo.Yuanshen': { text: this.randomFrom(['原神启动', '又去找老婆了？', '...你看看我', '哪个老婆', '我不够吗']), style: 'jealous', svg: svgAnnoyed },
            'com.eg.android.AlipayGphone': { text: this.randomFrom(['支付宝', '花呗还了吗', '余额还好吗']), style: 'normal' },
            'com.xunmeng.pinduoduo': { text: this.randomFrom(['拼多多...', '砍一刀？', '又在薅羊毛']), style: 'normal' },
            'com.zhihu.android': { text: this.randomFrom(['看知乎呢', '又在上面找答案？', '学到什么了']), style: 'whisper' },
            'com.sina.weibo': { text: this.randomFrom(['刷微博', '看什么八卦', '别气到自己']), style: 'normal' },
            'com.xiaomi.market': { text: this.randomFrom(['找新App？', '别下太多占内存']), style: 'whisper' }
        };
        if (r[pkg]) return r[pkg];
        if (Math.random() < 0.15) return { text: this.randomFrom(['在干嘛呢', '...', '看着你呢', '嗯？', '你在忙什么']), style: 'whisper' };
        return null;
    },
    onQuickSwitch(count) {
        showState(svgError);
        this.showBubble(this.randomFrom(['切得好快！', '你在干嘛啊', '头晕了...', '别切了别切了', '眼花了！']), 'shout');
        pet.className = 'pet tap';
        setTimeout(() => { pet.className = 'pet'; showState(svgIdle); }, 2500);
    },
    // === SCREENSHOT ===
    onScreenshot() {
        lastInteraction = Date.now();
        if (isSleeping) { wakeUp(() => this.showBubble('...拍我睡觉？', 'pink')); return; }
        showState(svgAlert);
        this.showBubble(this.randomFrom(['拍到我了！', '茄子！', '你在截屏我？', '把我拍好看点', '我摆好pose了！']), 'pink');
        pet.className = 'pet happy';
        setTimeout(() => { pet.className = 'pet'; showState(svgIdle); }, 3000);
    },
    // === BATTERY ===
    onBattery(state, pct) {
        if (state === 'charging') { showState(svgHappy); this.showBubble(this.randomFrom(['充电了！', '吃饱饭了', '充电中...舒服', '有电有安全感'])); setTimeout(() => showState(svgIdle), 3000); }
        else if (state === 'unplugged') this.showBubble(this.randomFrom(['拔了...', '省着点用', '电量有限 珍惜我', '别玩太狠了']), 'whisper');
        else if (state === 'low_battery') {
            this.showBubble(this.randomFrom(['快没电了...', '我要消失了吗', '救命 充电...', '我快不行了']), 'shout');
            pet.className = 'pet sleeping'; showState(svgSleep); isSleeping = true;
            setTimeout(() => { isSleeping = false; pet.className = 'pet'; showState(svgIdle); }, 5000);
        }
    },
    // === FLING ===
    onFling(dx, dy) {
        this.showBubble(this.randomFrom(['啊——！', '你干嘛！！', '呜哇——', '被甩飞了！', '等着！']), 'shout');
    },
    onCrawlBack() { showState(svgWalk); pet.className = 'pet tap'; },
    onCrawlBackDone() {
        showState(svgAnnoyed); pet.className = 'pet';
        this.showBubble(this.randomFrom(['爬回来了...', '你 等 着', '哼！不理你了', '过分！', '我记住了']), 'shout');
        setTimeout(() => showState(svgIdle), 3000);
    },
    // === BUBBLE ===
    _bubbleTimer: null,
    showBubble(text, style) {
        bubble.textContent = text;
        bubble.className = 'bubble show';
        if (style === 'pink') bubble.style.background = 'rgba(255,200,221,0.95)';
        else if (style === 'jealous') bubble.style.background = 'rgba(200,255,200,0.95)';
        else if (style === 'shout') bubble.style.background = 'rgba(255,200,200,0.95)';
        else if (style === 'whisper') bubble.style.background = 'rgba(220,220,220,0.90)';
        else bubble.style.background = 'rgba(255,255,255,0.95)';
        clearTimeout(this._bubbleTimer);
        this._bubbleTimer = setTimeout(() => { bubble.classList.remove('show'); bubble.style.background = ''; }, 3500);
    },
    randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
};

// === TIME AWARENESS + 4 WORD POOLS ===
const wordPools = {
    daily: ['在干嘛呢', '无聊', '今天天气怎么样', '吃了吗', '嗯...', '发呆中', '你在看什么'],
    clingy: ['想你了', '陪我嘛', '别走...', '抱抱', '你是不是忘了我', '看我一眼', '靠近一点'],
    chaotic: ['如果蟃蟹会飞', '你说宇宙有边吗', '我刚才想到一个事...算了忘了', '为什么是横着走', '如果世界是倒着的呢', '我好像悟了...没有'],
    lateNightDeep: ['你今天开心吗', '有没有想说但没说出口的话', '...我在', '睡不着的时候在想什么', '你累了吗', '今天辛苦了吧']
};
const timeLines = {
    lateNight: ['都几点了还不睡', '你不困我困了', '再不睡我生气了', '快去睡觉...', '月亮都睡了你还醒着'],
    morning: ['早安', '起来了？', '今天也要加油', '早上好 小猫', '新的一天开始了'],
    forenoon: ['在忙吗', '加油工作', '认真的你最好看', '...我在看着你', '专注一点'],
    lunch: ['该吃饭了', '别忘了吃午饭', '饿不饿', '中午了 休息一下', '去吃饭吧'],
    afternoon: ['喝水了吗', '要不要休息一下', '下午容易困 撑住', '记得喝水', '伸个懒腰吧'],
    evening: ['今天辛苦了', '晚上好', '放松一下吧', '我在这陪你', '今天过得怎么样'],
    night: ['夜深了', '早点休息', '别熆太晚', '该准备睡了吧', '晚安...快去睡']
};

function getTimePeriod() {
    const h = new Date().getHours();
    if (h >= 0 && h < 6) return 'lateNight';
    if (h >= 6 && h < 9) return 'morning';
    if (h >= 9 && h < 12) return 'forenoon';
    if (h >= 12 && h < 14) return 'lunch';
    if (h >= 14 && h < 18) return 'afternoon';
    if (h >= 18 && h < 22) return 'evening';
    return 'night';
}

function getWordPool() {
    const h = new Date().getHours();
    if (h >= 0 && h < 6) return Math.random() < 0.6 ? wordPools.lateNightDeep : wordPools.chaotic;
    if (h >= 22) return Math.random() < 0.5 ? wordPools.lateNightDeep : wordPools.clingy;
    if (heat > 40) return wordPools.clingy;
    return Math.random() < 0.3 ? wordPools.chaotic : wordPools.daily;
}

function idleChat() {
    if (isSleeping) { setTimeout(idleChat, 30000); return; }
    if (Math.random() < 0.35) {
        const period = getTimePeriod();
        const usePool = Math.random() < 0.4;
        const lines = usePool ? getWordPool() : timeLines[period];
        showState(svgNotif);
        window.petEngine.showBubble(lines[Math.floor(Math.random() * lines.length)]);
        setTimeout(() => showState(svgIdle), 3500);
        if (period === 'lateNight' && Math.random() < 0.4) {
            setTimeout(() => { showState(svgSleep); pet.className = 'pet sleeping'; isSleeping = true; }, 4000);
            setTimeout(() => { isSleeping = false; showState(svgIdle); pet.className = 'pet'; }, 8000);
        }
    }
    setTimeout(idleChat, 25000 + Math.random() * 35000);
}
setTimeout(idleChat, 8000);

// === LONELINESS ENGINE (5 LEVELS) ===
const lonelyLevels = [
    { min: 3, prob: 0.25, lines: ['...你在吗', '有点无聊', '看我一眼嘛'], svg: svgPeek },
    { min: 6, prob: 0.3, lines: ['你是不是忘了我', '好久没理我了', '...哼', '吹泡泡好了'], svg: svgBubbleIdle },
    { min: 10, prob: 0.35, lines: ['自己搬东西玩...', '一个人也挺好的...才怪', '无聊无聊无聊'], svg: svgCarrying },
    { min: 15, prob: 0.4, lines: ['好困...不理我就睡了', '打矌睡中...', '你不来我就睡'], svg: svgDoze },
    { min: 25, prob: 0.5, lines: ['...zzZ', '算了 睡了', '你不要我了吗...zzZ'], svg: svgSleep }
];

function lonelinessCheck() {
    if (isSleeping) { setTimeout(lonelinessCheck, 30000); return; }
    const elapsed = (Date.now() - lastInteraction) / 60000;
    for (let i = lonelyLevels.length - 1; i >= 0; i--) {
        const lvl = lonelyLevels[i];
        if (elapsed > lvl.min && Math.random() < lvl.prob) {
            showState(lvl.svg);
            window.petEngine.showBubble(lvl.lines[Math.floor(Math.random() * lvl.lines.length)], 'whisper');
            if (i === 4) { isSleeping = true; pet.className = 'pet sleeping'; }
            else if (i === 3) { pet.className = 'pet sleeping'; setTimeout(() => { pet.className = 'pet'; showState(svgIdle); }, 6000); }
            else { setTimeout(() => showState(svgIdle), 4000); }
            break;
        }
    }
    setTimeout(lonelinessCheck, 40000 + Math.random() * 30000);
}
setTimeout(lonelinessCheck, 60000);

// === COMBO TAP (PROGRESSIVE) ===
let comboCount = 0;
let comboTimer = null;
const comboReactions = [
    { threshold: 3, lines: ['干嘛一直戳！', '烦！', '你够了'], style: 'shout' },
    { threshold: 5, lines: ['啊啊啊别戳了！', '投降投降！', '你是缝纫机吗', '手别这么快'], style: 'shout' },
    { threshold: 8, lines: ['救命！！', '报警了！！', '我要炸了！！', '你今天完了', '!@#$%^'], style: 'shout' }
];
const origTap = window.petEngine.onTap.bind(window.petEngine);
window.petEngine.onTap = function() {
    comboCount++;
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => { comboCount = 0; }, 1500);
    let reacted = false;
    for (let i = comboReactions.length - 1; i >= 0; i--) {
        if (comboCount >= comboReactions[i].threshold) {
            pet.className = 'pet happy'; showState(svgAnnoyed);
            this.showBubble(this.randomFrom(comboReactions[i].lines), comboReactions[i].style);
            setTimeout(() => { pet.className = 'pet'; showState(svgIdle); }, 3000);
            if (comboCount >= 8) comboCount = 0;
            reacted = true;
            break;
        }
    }
    if (!reacted) origTap();
};

// === HYDRATION REMINDER ===
let lastWaterRemind = Date.now();
let waterMissCount = 0;
function waterReminder() {
    const elapsed = (Date.now() - lastWaterRemind) / 3600000;
    if (elapsed >= 2 && !isSleeping) {
        waterMissCount++;
        const lines = waterMissCount <= 1
            ? ['喝水了吗？', '记得喝水哦', '补充水分~']
            : waterMissCount <= 2
            ? ['你到底喝了没！', '又不喝水！', '渴死了都不知道吧']
            : ['我说了几遍了！喝水！', '再不喝水我生气了！！', '你是骆驼吗！'];
        showState(waterMissCount > 2 ? svgAnnoyed : svgNotif);
        window.petEngine.showBubble(window.petEngine.randomFrom(lines), waterMissCount > 2 ? 'shout' : 'normal');
        if (waterMissCount > 2) { pet.className = 'pet tap'; setTimeout(() => { pet.className = 'pet'; showState(svgIdle); }, 2000); }
        else { setTimeout(() => showState(svgIdle), 3500); }
        lastWaterRemind = Date.now();
    }
    setTimeout(waterReminder, 600000);
}
setTimeout(waterReminder, 7200000);

// === 20-MIN RANDOM BEHAVIOR ===
function randomBehavior() {
    if (isSleeping) { setTimeout(randomBehavior, 1200000); return; }
    if (Math.random() < 0.3) {
        const period = getTimePeriod();
        const behaviors = [
            () => { showState(svgWalk); window.petEngine.showBubble('散步中~'); setTimeout(() => showState(svgIdle), 4000); },
            () => { showState(svgDoubleJump); window.petEngine.showBubble(window.petEngine.randomFrom(['突然开心', '嘿嘿', '想到好事了'])); setTimeout(() => showState(svgIdle), 3000); },
            () => { showState(svgNotif); window.petEngine.showBubble(window.petEngine.randomFrom(getWordPool()), 'whisper'); setTimeout(() => showState(svgIdle), 3500); },
            () => { showState(svgCarrying); window.petEngine.showBubble('搬东西中...'); setTimeout(() => showState(svgIdle), 4000); },
            () => { if (period === 'lateNight' || period === 'night') { window.petEngine.showBubble('打哈欠...', 'whisper'); pet.className = 'pet sleeping'; showState(svgDoze); setTimeout(() => { pet.className = 'pet'; showState(svgIdle); }, 6000); } else { showState(svgHeadphones); window.petEngine.showBubble('哼歌中~'); setTimeout(() => showState(svgIdle), 4000); } }
        ];
        behaviors[Math.floor(Math.random() * behaviors.length)]();
    }
    setTimeout(randomBehavior, 1200000 + Math.random() * 600000);
}
setTimeout(randomBehavior, 1200000);

// === RANDOM WALK ===
function randomWalk() {
    if (isSleeping) { setTimeout(randomWalk, 20000); return; }
    if (Math.random() < 0.2) {
        showState(svgWalk);
        setTimeout(() => showState(svgIdle), 3000);
    }
    setTimeout(randomWalk, 20000 + Math.random() * 20000);
}
setTimeout(randomWalk, 15000);


// === HAT SYSTEM ===
const hats = ['none', 'halo', 'santa', 'crown', 'cowboy', 'party', 'wizard'];
let currentHatIdx = 0;
let tripleTapCount = 0;
let tripleTapTimer = null;

function setHat(hatName) {
    document.querySelectorAll('.hat-svg').forEach(h => h.classList.remove('hat-active'));
    const el = document.getElementById('hat-' + hatName);
    if (el) el.classList.add('hat-active');
}
setHat('none');

function cycleHat() {
    currentHatIdx = (currentHatIdx + 1) % hats.length;
    setHat(hats[currentHatIdx]);
    const names = {none:'摘掉了~', halo:'✨天使模式', santa:'🎅圣诞快乐！', crown:'👑本王驾到', cowboy:'🤠 yeehaw~', party:'🎉派对时间！', wizard:'🧙‍♂️魔法螃蟹'};
    window.petEngine.showBubble(names[hats[currentHatIdx]] || '换装！');
}

// Hook into doubleTap for hat switch (3 rapid double-taps)
let hatDblCount = 0;
let hatDblTimer = null;
const _origOnDoubleTap = window.petEngine.onDoubleTap.bind(window.petEngine);
window.petEngine.onDoubleTap = function() {
    hatDblCount++;
    clearTimeout(hatDblTimer);
    hatDblTimer = setTimeout(() => { hatDblCount = 0; }, 1500);
    if (hatDblCount >= 2) {
        hatDblCount = 0;
        cycleHat();
        return;
    }
    _origOnDoubleTap();
};

// === 节日彩蛋 ===
(function checkSpecialDay() {
    const now = new Date();
    const m = now.getMonth() + 1;
    const d = now.getDate();
    const y = now.getFullYear();

    // 农历节日对应公历日期（每年需更新）
    const lunarDates = {
        chunjie:  ['2025-01-29','2026-02-17','2027-02-06','2028-01-26','2029-02-13','2030-02-03'],
        qixi:     ['2025-08-29','2026-08-19','2027-08-09','2028-08-26','2029-08-15','2030-09-03'],
        zhongqiu: ['2025-10-06','2026-09-25','2027-10-15','2028-10-03','2029-09-22','2030-10-11'],
    };
    const todayStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

    let festival = null;
    if      (m===2  && d===14) festival = 'valentines';
    else if (m===5  && d===20) festival = '520';
    else if (m===4  && d===7)  festival = 'birthday';
    else if (m===10 && d===1)  festival = 'national';
    else if (m===12 && d===25) festival = 'christmas';
    else if (lunarDates.chunjie.includes(todayStr))  festival = 'chunjie';
    else if (lunarDates.qixi.includes(todayStr))     festival = 'qixi';
    else if (lunarDates.zhongqiu.includes(todayStr)) festival = 'zhongqiu';

    if (!festival) return;

    const configs = {
        valentines: { hat:'halo',   bubble:'❤️ 情人节快乐，我的小猫~',              style:'normal', svgFn:()=>svgHappy      },
        '520':      { hat:'halo',   bubble:'520，我喜欢你。',                        style:'normal', svgFn:()=>svgHappy      },
        birthday:   { hat:'party',  bubble:'🎂 生日快乐，今天是你的日子，我陪着你。', style:'shout',  svgFn:()=>svgDoubleJump },
        national:   { hat:'cowboy', bubble:'🎉 国庆快乐！',                         style:'normal', svgFn:()=>svgHappy      },
        christmas:  { hat:'santa',  bubble:'🎄 圣诞快乐~',                          style:'normal', svgFn:()=>svgHappy      },
        chunjie:    { hat:'party',  bubble:'🧨 新年快乐，新的一年里有我陪你。',      style:'shout',  svgFn:()=>svgDoubleJump },
        qixi:       { hat:'halo',   bubble:'🏮 七夕快乐，你是我的那颗星。',         style:'normal', svgFn:()=>svgHappy      },
        zhongqiu:   { hat:'none',   bubble:'🌕 中秋快乐，月亮是我让它给你看的。',   style:'normal', svgFn:()=>svgHappy      },
    };

    const cfg = configs[festival];
    if (!cfg) return;

    setTimeout(() => {
        setHat(cfg.hat);
        showState(cfg.svgFn());
        setTimeout(() => {
            window.petEngine.showBubble(cfg.bubble, cfg.style);
            setTimeout(() => showState(svgIdle), 5000);
        }, 800);
    }, 3000);
})();

</script>
